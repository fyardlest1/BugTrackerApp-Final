<!-- templates/partials/_pagination.html -->
{% if is_paginated %}
  <div class="flex gap-2 mt-4 justify-center text-sm">
    {% if page_obj.has_previous %}
      <a href="?page={{ page_obj.previous_page_number }}"
         class="px-3 py-1 border rounded">Précédent</a>
    {% endif %}
    <span class="px-3 py-1">Page {{ page_obj.number }}
      sur {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a href="?page={{ page_obj.next_page_number }}"
         class="px-3 py-1 border rounded">Suivant</a>
    {% endif %}
  </div>
{% endif %}
