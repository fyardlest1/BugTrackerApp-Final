<!-- templates/registration/password_change_done.html -->
{% extends 'base.html' %}
{% block title %}Mot de passe mis à jour - BugTracker{% endblock %}

{% block content %}
<div class="max-w-md mx-auto text-center py-20 px-4 flex flex-col items-center justify-center min-h-[50vh]">
  
  <!-- 1. Icône de succès / validation -->
  <div class="w-16 h-16 rounded-2xl bg-emerald-50 flex items-center justify-center mb-6 border border-emerald-100 shadow-sm">
    <svg class="w-8 h-8 text-emerald-600" style="color: #059669;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
  </div>

  <!-- 2. Titre principal -->
  <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-gray-900 mb-3" style="color: #1f2937;">
    Mot de passe mis à jour
  </h1>
  
  <!-- 3. Message explicatif -->
  <p class="text-gray-500 text-sm sm:text-base leading-relaxed mb-8 max-w-sm">
    Votre mot de passe a été modifié avec succès. Vous pouvez désormais l'utiliser pour vos prochaines connexions.
  </p>
  
  <!-- 4. Bouton de retour au profil (Alignement horizontal garanti) -->
  <a href="{% url 'profile' %}"
     class="inline-flex items-center justify-center bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md shadow-emerald-600/10 transition-all duration-200 hover:-translate-y-0.5"
     style="background-color: #059669;">
    
    <svg class="w-4 h-4 mr-2 flex-shrink-0 inline-block align-middle" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
    </svg>
    
    <span class="inline-block align-middle">Retour à mon profil</span>
  </a>
  
</div>
{% endblock %}
